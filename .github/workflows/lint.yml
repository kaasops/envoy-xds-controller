name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.26'

      - name: Verify generated xDS type imports
        run: make verify-xds-filters

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
