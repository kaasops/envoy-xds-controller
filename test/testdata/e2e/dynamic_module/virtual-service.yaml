apiVersion: envoy.kaasops.io/v1alpha1
kind: VirtualService
metadata:
  name: vs-dynamic-module
  annotations:
    envoy.kaasops.io/node-id: test
spec:
  listener:
    name: http-dynamic-module
  httpFilters:
    - name: envoy.filters.http.router
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  additionalHttpFilters:
    - name: dynamic-module
  virtualHost:
    name: dynamic-module-vh
    domains:
      - dynamic-module.kaasops.io
    routes:
      - match:
          prefix: "/"
        direct_response:
          status: 200
          body:
            inline_string: "{\"message\":\"dynamic module\"}\n"
