apiVersion: envoy.kaasops.io/v1alpha1
kind: VirtualService
metadata:
  name: dpl-vs-wc-b
  annotations:
    envoy.kaasops.io/node-id: test
spec:
  listener:
    name: dpl-wc-b
  httpFilters:
    - name: envoy.filters.http.router
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  virtualHost:
    name: dpl-vh-wc-b
    domains:
      - "*"
    routes:
      - match:
          prefix: "/"
        direct_response:
          status: 200
          body:
            inline_string: "wildcard-b"
