apiVersion: envoy.kaasops.io/v1alpha1
kind: VirtualService
metadata:
  name: dpl-vs-duplicate-same-listener
  annotations:
    envoy.kaasops.io/node-id: test
spec:
  listener:
    name: dpl-a
  httpFilters:
    - name: envoy.filters.http.router
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  virtualHost:
    name: dpl-vh-dup
    domains:
      - dup.kaasops.io
    routes:
      - match:
          prefix: "/"
        direct_response:
          status: 200
          body:
            inline_string: "should-never-apply"
